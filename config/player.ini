# Signage-player — configuratie
#
# Aangemaakt als /etc/signage/player.ini bij de eerste installatie.
# Na een wijziging:  sudo systemctl restart signage-player

[player]
# Adres van de signage-server. Op de Pi zelf: http://127.0.0.1:<poort>
server_url = http://127.0.0.1:80
# Geheim token waarmee deze player zich aanmeldt. Wordt door de installer gemaakt.
token =
# Cache met de laatst geldige playlist (en gedownloade media bij een externe player).
cache_dir = /var/lib/signage/player

# --- mpv ------------------------------------------------------------------
mpv_binary = mpv
# Hardwaredecodering. v4l2m2m-copy gebruikt de H.264-decoder van de Pi 3B+.
# Lukt dat niet, dan valt mpv automatisch terug op softwaredecodering.
# Problemen met beeld? Probeer: no
hwdec = v4l2m2m-copy
# Video-uitvoer direct op het scherm, zonder desktop.
vo = gpu
gpu_context = drm
# Audio-uitgang. auto = standaard ALSA-apparaat. HDMI-geluid forceren, bijvoorbeeld:
#   audio_device = alsa/hdmi:CARD=vc4hdmi,DEV=0
# Beschikbare apparaten tonen:  mpv --audio-device=help
audio_device = auto
# Extra mpv-opties (gevorderd), bijvoorbeeld: --drm-mode=1920x1080@60
extra_args =

# --- synchronisatie -----------------------------------------------------------
# Hoe vaak (seconden) de player om wijzigingen vraagt en zich meldt.
poll_interval = 5
heartbeat_interval = 15
