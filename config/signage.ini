# Signage — centrale configuratie (systeemniveau)
#
# Dit bestand wordt bij de eerste installatie aangemaakt als /etc/signage/signage.ini
# en daarna NOOIT door het installatiescript overschreven.
# Na een wijziging:  sudo systemctl restart signage-server
#
# Instellingen die je in de beheerwebsite wijzigt (systeemnaam, standaardduur,
# standaardplaylist, volume) staan in de database, niet hier.

[server]
# Netwerkadres waarop de beheerwebsite luistert. 0.0.0.0 = alle netwerkkaarten.
bind = 0.0.0.0
# Poort van de beheerwebsite. Bij 80 hoef je geen poort in de browser te typen.
port = 80
# Aantal gelijktijdige verzoeken.
threads = 6
# false = alleen verzoeken vanaf lokale/privé-adressen (192.168.x.x, 10.x.x.x,
# 172.16-31.x.x, link-local) worden beantwoord. Laat dit op false staan.
allow_public_clients = false

[storage]
# Database, media, back-ups en tijdelijke bestanden.
data_dir = /var/lib/signage
# Maximale grootte van één upload in MB.
max_upload_mb = 2048
# Uploads worden geweigerd als er daarna minder dan dit aantal MB vrij zou zijn.
min_free_mb = 500

[media]
# Afbeeldingen worden voor het afspelen verkleind tot maximaal dit formaat.
# De GPU van de Pi 3B+ kan niet meer dan 2048x2048 pixels verwerken.
max_image_width = 1920
max_image_height = 1080
# Grotere afbeeldingen worden geweigerd (geheugen van de Pi 3B+: 1 GB).
max_image_megapixels = 40

[security]
# Hoe lang je ingelogd blijft (uren).
session_hours = 12

[system]
# Hulpprogramma voor systeemacties (hostnaam, tijd, herstart). Leeg = uit.
priv_helper = /usr/local/sbin/signage-priv
# Configuratie van de lokale player (bevat het player-token).
local_player_config = /etc/signage/player.ini
# Aantal automatische nachtelijke back-ups dat bewaard blijft.
auto_backup_keep = 14
